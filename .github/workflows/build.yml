name: Build APK Web2App

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'Link វេបសាយ (ឧ. https://google.com)'
        required: true
        default: 'https://google.com'
      app_name:
        description: 'ឈ្មោះ App'
        required: true
        default: 'My App'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ទាញយកកូដ
        uses: actions/checkout@v4

      - name: រៀបចំ Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ជំនួស Link និង ឈ្មោះ App
        run: |
          find . -type f \( -name "*.java" -o -name "*.kt" \) -exec sed -i "s|https://.*google.com|${{ github.event.inputs.web_url }}|g" {} +
          find app/src/main/res/values/ -type f -name "strings.xml" -exec sed -i 's|<string name="app_name">.*</string>|<string name="app_name">${{ github.event.inputs.app_name }}</string>|g' {} +

      - name: ផ្ដល់សិទ្ធិ Gradle
        run: chmod +x gradlew

      - name: ចាប់ផ្តើម Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: ផ្ញើ File APK ឱ្យទាញយក
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: app/build/outputs/apk/debug/*.apk
          
